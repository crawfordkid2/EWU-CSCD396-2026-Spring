name: Assignment 3 Function Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - Assignment-3
    paths:
      - 'Assignment2/FunctionApp/**'
      - '.github/workflows/assignment3-function.yml'

permissions:
  id-token: write
  contents: read

env:
  FUNCTION_APP_NAME: 'func-assignment3-crawford'
  FUNCTION_PROJECT_PATH: './Assignment2/FunctionApp/MessageFunctionApp'

jobs:
  deploy-function:
    name: Deploy Azure Function
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: ${{ env.FUNCTION_PROJECT_PATH }}
        run: dotnet restore

      - name: Build
        working-directory: ${{ env.FUNCTION_PROJECT_PATH }}
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        working-directory: ${{ env.FUNCTION_PROJECT_PATH }}
        run: dotnet publish --configuration Release --output ./publish

      - name: Zip Function App
        working-directory: ${{ env.FUNCTION_PROJECT_PATH }}/publish
        run: zip -r ../functionapp.zip .

      - name: Deploy Function App
        run: |
          az functionapp deployment source config-zip \
            --name $FUNCTION_APP_NAME \
            --resource-group rg-assignment3-crawford \
            --src $FUNCTION_PROJECT_PATH/functionapp.zip